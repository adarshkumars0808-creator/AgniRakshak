name: Auto Update FIRMS Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pandas numpy scikit-learn requests geopandas shapely python-dotenv

      - name: Run auto-update pipeline
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          python src/auto_update.py
          python src/fetch_nrt.py
          python src/build_json.py

      - name: Commit and push updated JSON
        run: |
          git config user.name "AgniRakshak Bot"
          git config user.email "bot@agnirakshak.dev"
          git add data/processed/*.json
          git diff --staged --quiet || git commit -m "Auto-update %Y-%m-%dT%H:%M:%SZ"
          git push
